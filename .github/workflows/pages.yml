name: Pages

# Publishes the static demo (dashboard + browser-side demo backend) to GitHub Pages.
on:
  push:
    branches: [main, claude/youthful-cori-h0q3au]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install triage service dependencies
        run: pip install -r triage-service/requirements.txt
      - name: Build site (runs the real triage service over the sample alerts)
        run: ./pages/build.sh site
      - name: Test dashboard and demo backend
        run: |
          node app/src/test/js/app.test.cjs
          node pages/demo.test.cjs site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
